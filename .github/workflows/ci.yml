name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rl
          POSTGRES_PASSWORD: rl_ci_pw
          POSTGRES_DB: rotationlab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rl -d rotationlab" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # web build-time public config (no secrets)
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3100
      NEXT_PUBLIC_API_BASE: /api/v1
      NEXT_PUBLIC_SOCKET_PATH: /realtime
      NEXT_PUBLIC_TILES_BASE_URL: /tiles
      INTERNAL_API_URL: http://localhost:4000
      # server (integration tests + the API Playwright starts). CI-only throwaway secrets.
      NODE_ENV: test
      PORT: '4000'
      APP_ORIGIN: http://localhost:3100
      DATABASE_URL: postgresql://rl:rl_ci_pw@localhost:5432/rotationlab?schema=public
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://rl:rl_ci_pw@localhost:5432/rotationlab_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      JWT_ISSUER: rotationlab
      JWT_AUDIENCE: rotationlab-web
      COOKIE_SECURE: 'false'
      IP_HASH_SALT: ci-only-ip-hash-salt-0123456789
      TRUST_PROXY: 'false'
      ARGON2_MEMORY_KIB: '4096'
      ARGON2_ITERATIONS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Every import is a declared dependency
        run: pnpm check:deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate database
        run: pnpm --filter server exec prisma migrate deploy

      - name: Integration tests (Postgres + Redis)
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Production build has no debug hook
        run: pnpm --filter web check:no-debug

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (fixture tiles, real API)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # A clean clone must install and boot: no pnpm cache, frozen lockfile, the *built* API against
  # fresh service containers, until /api/health says ok (Phase 6: undeclared server deps only
  # resolved from a stale local node_modules).
  fresh-clone-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rl
          POSTGRES_PASSWORD: rl_ci_pw
          POSTGRES_DB: rotationlab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rl -d rotationlab" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20

    env:
      # production mode on purpose: the config guards (secure cookies, rate limits on) apply
      NODE_ENV: production
      PORT: '4000'
      APP_ORIGIN: https://ci.invalid
      DATABASE_URL: postgresql://rl:rl_ci_pw@127.0.0.1:5432/rotationlab?schema=public
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      JWT_ISSUER: rotationlab
      JWT_AUDIENCE: rotationlab-web
      COOKIE_SECURE: 'true'
      RATE_LIMITS_ENABLED: 'true'
      IP_HASH_SALT: ci-only-ip-hash-salt-0123456789
      TRUST_PROXY: 'false'
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4 # no `cache:` — a truly clean install
        with:
          node-version-file: .nvmrc

      - name: Clean install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the API (and the shared package it needs)
        run: pnpm turbo run build --filter=server

      - name: Migrate database
        run: pnpm --filter server exec prisma migrate deploy

      - name: Boot the built API until /api/health is ok
        run: |
          node apps/server/dist/index.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:4000/api/health || true)
            echo "$body" | grep -q '"status":"ok"' && { echo "healthy: $body"; exit 0; }
            sleep 1
          done
          echo "API did not become healthy"; cat api.log; exit 1

  # SECURITY §8–9 / TESTING §5.8: no high/critical advisory in production deps (accepted ones are
  # listed in package.json pnpm.auditConfig with the reason in SECURITY §9), no secret in history.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans every commit

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --exit-code 1

  # The deploy images must keep building (Dockerfile drift breaks releases, not PRs, otherwise).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_APP_ORIGIN=https://ci.invalid
            NEXT_PUBLIC_TILES_BASE_URL=https://tiles.ci.invalid/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
