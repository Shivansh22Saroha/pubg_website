name: Vehicle spawns

# Rebuilds apps/web/public/spawns/<map>.json from PUBG's official API (packages/vehicle-spawns):
# where each vehicle is first entered in a sample of recent PC matches = its spawn point.
# Run by hand from the Actions tab. Needs the repo secret PUBG_API_KEY (developer.pubg.com).
# It pushes the result to a new data/vehicle-spawns-<run> branch; review and merge it through a
# pull request like any other change (the files are validated on load by the web app).
on:
  workflow_dispatch:
    inputs:
      matches_per_map:
        description: Matches to read per map (more = more complete, slower)
        default: '250'
        required: true

permissions:
  contents: write # push the data branch only

concurrency: { group: vehicle-spawns, cancel-in-progress: false }

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @rotationlab/shared build

      - name: Generate spawn files
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          MATCHES_PER_MAP: ${{ inputs.matches_per_map }}
        run: |
          case "$MATCHES_PER_MAP" in ''|*[!0-9]*) echo "matches_per_map must be a number"; exit 1;; esac
          pnpm --filter vehicle-spawns generate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Push to a data branch
        run: |
          if git diff --quiet -- apps/web/public/spawns && [ -z "$(git ls-files --others -- apps/web/public/spawns)" ]; then
            echo "No changes to the spawn files." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          branch="data/vehicle-spawns-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/web/public/spawns
          git commit -m "Vehicle spawns from PUBG API (run ${GITHUB_RUN_ID})"
          git push origin "$branch"
          echo "Pushed **$branch** — open a pull request from it." >> "$GITHUB_STEP_SUMMARY"
