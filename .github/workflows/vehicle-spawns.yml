name: Vehicle spawns

# Rebuilds apps/web/public/spawns/<map>.json from PUBG's official API (packages/vehicle-spawns):
# where each vehicle is first entered in a sample of recent PC matches = its spawn point.
# Run by hand from the Actions tab. Needs the repo secret PUBG_API_KEY (developer.pubg.com).
# It pushes the result to a new data/vehicle-spawns-<run> branch; review and merge it through a
# pull request like any other change (the files are validated on load by the web app).
on:
  workflow_dispatch:
    inputs:
      matches_per_map:
        description: Matches to read per map (more = more complete, slower)
        default: '250'
        required: true

permissions:
  contents: write # push the data branch only

concurrency: { group: vehicle-spawns, cancel-in-progress: false }

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @rotationlab/shared build

      - name: Probe recall telemetry
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          PROBE_MATCHES: '40'
        working-directory: packages/vehicle-spawns
        run: npx tsx scripts/probe.ts

      - name: Push probe data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "probe-data-${GITHUB_RUN_ID}"
          git add -f packages/vehicle-spawns/probe.json
          git commit -qm probe -n
          git push origin "probe-data-${GITHUB_RUN_ID}"
