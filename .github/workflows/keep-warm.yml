name: Keep API warm

# Render's free plan stops the API after ~15 min without traffic, and the next visitor waits
# ~1 min on 502s while it boots. Pinging /api/live every 10 min keeps it running (one
# always-on service fits in the free 750 instance-hours a month). /api/live touches no database,
# so Neon still sleeps between real visits (its free plan counts compute hours).
#
# Repo variable (optional): KEEPALIVE_URL — defaults to the Render liveness endpoint below.
# GitHub pauses scheduled workflows after 60 days without repo activity; re-enable it from the
# Actions tab if that happens.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency: { group: keep-warm, cancel-in-progress: true }

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/live
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://rotationlab-api-bhfx.onrender.com/api/live' }}
        run: |
          # a cold start answers 502/503 for up to a minute, so keep trying for ~3 min
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$URL" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::warning::API did not answer 200 within 3 minutes ($URL)"
          exit 1
