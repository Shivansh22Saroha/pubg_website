# Dev infrastructure (docs/ENVIRONMENT.md §4). Credentials here are dev-only placeholders.
# Host ports can be overridden in a root .env (POSTGRES_PORT / REDIS_PORT) if 5432/6379 are taken.
name: rotationlab

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl_dev_pw
      POSTGRES_DB: rotationlab
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rl -d rotationlab']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', 'redis_dev_pw', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_dev_pw', '--no-auth-warning', 'ping']
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    profiles: ['email']

volumes:
  pgdata: {}
  redisdata: {}
