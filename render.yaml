# Render Blueprint (DEPLOYMENT §10): the API + realtime server and its Redis, on Render's free plan.
# Render → New → Blueprint → this repo. Postgres is Neon (free, doesn't expire); the web app is Vercel.
services:
  - type: web
    name: rotationlab-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./docker/server.Dockerfile
    dockerContext: ./
    # free instances have no pre-deploy step: migrate on start (fast no-op when up to date).
    # Render runs this without a shell, hence a script rather than `sh -c "… && …"`.
    dockerCommand: sh scripts/start.sh
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: APP_ORIGIN # https://<your-project>.vercel.app
        sync: false
      - key: DATABASE_URL # Neon *direct* connection string (pooling off), ends ?sslmode=require
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: rotationlab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: JWT_ISSUER
        value: rotationlab
      - key: JWT_AUDIENCE
        value: rotationlab-web
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: 'true'
      - key: LOG_LEVEL
        value: info
      - key: EMAIL_ENABLED
        value: 'false'
      - key: MAINTENANCE
        value: 'false'
      # site admins (FEATURES F16): your own account email(s), comma-separated — set in the dashboard
      - key: ADMIN_EMAILS
        sync: false
      # Sign in with Google (FEATURES F17): from Google Cloud → Google Auth Platform → Clients
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: keyvalue
    name: rotationlab-redis
    plan: free
    region: singapore
    ipAllowList: [] # internal connections only
    # every key the API writes has a TTL (presence, rate limits, tickets, caches)
    maxmemoryPolicy: volatile-lru
